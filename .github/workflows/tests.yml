name: Tests

on:
  push:
    branches: [master, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  checks: write
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Scopes
          - name: Scopes + Addressables
            addressables: true
    steps:
      # the Unity editor image needs more space than a fresh runner has
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: TestProject~/Library
          key: Library-${{ matrix.name }}-${{ hashFiles('TestProject~/Packages/manifest.json') }}
          restore-keys: Library-${{ matrix.name }}-

      - name: Install Addressables
        if: matrix.addressables
        run: |
          manifest='TestProject~/Packages/manifest.json'
          jq '.dependencies["com.unity.addressables"] = "2.9.1"' "$manifest" > manifest.tmp && mv manifest.tmp "$manifest"

      - uses: game-ci/unity-test-runner@v4.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: TestProject~
          customImage: unityci/editor:ubuntu-6000.3.19f1-base-3
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test results (${{ matrix.name }})
