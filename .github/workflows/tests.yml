name: Tests

on:
  push:
    branches: [master, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  checks: write
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Scopes
          - name: Scopes + Addressables
            addressables: true
    steps:
      - name: Checkout Package
        uses: actions/checkout@v4
        with:
          path: kott-scopes
          fetch-depth: 1

      # Addressables is optional; declaring it in the checked-out package.json pulls it into the test project
      - name: Add Addressables
        if: matrix.addressables
        working-directory: kott-scopes
        run: jq '.dependencies["com.unity.addressables"] = "2.9.1"' package.json > package.tmp && mv package.tmp package.json

      # packageMode creates a temporary empty project and adds the package as a testable;
      # com.kott.utilities resolves from OpenUPM
      - name: Run Package Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          packageMode: true
          projectPath: kott-scopes
          unityVersion: 6000.3.19f1
          scopedRegistryUrl: https://package.openupm.com
          registryScopes: com.kott
          testMode: All # runs PlayMode and EditMode tests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test results (${{ matrix.name }})
